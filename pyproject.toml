[project]
name = "mp-semicl-behavior"
version = "1.0.0"
description = "A behavioural digital twin of larval zebrafish responding to groups of dots (MSc thesis code)"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=15",           # the screen data set's parquet files
    "imageio-ffmpeg>=0.5",   # bundled ffmpeg for the shoaling videos
    "ipython>=8.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin", "figures"]
