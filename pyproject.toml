[project]
name = "mp-semicl-behavior"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
